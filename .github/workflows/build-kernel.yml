name: Build CronosKernel DT2W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex \
              libssl-dev libelf-dev libncurses-dev git wget unzip \
              python3 ccache

      - name: Setup Linaro 4.9.4 toolchain
        run: |
          wget --timeout=300 https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/aarch64-linux-gnu/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          tar xf gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          echo "$PWD/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu/bin" >> $GITHUB_PATH
          aarch64-linux-gnu-gcc --version

      - name: Checkout kernel source from upstream
        uses: actions/checkout@v4
        with:
          repository: ananjaser1211/Cronos_8890
          ref: cronos
          path: Cronos

      - name: Verify kernel source
        run: ls Cronos/drivers/input/touchscreen/wake_gestures.c

      - name: Patch DT2W
        run: |
          cd Cronos
          sed -i 's/#define DT2W_DEFAULT\t\t0/#define DT2W_DEFAULT\t\t1/' \
              drivers/input/touchscreen/wake_gestures.c
          grep -n "DT2W_DEFAULT" drivers/input/touchscreen/wake_gestures.c

      - name: Build kernel
        run: |
          cd Cronos
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out hero2_defconfig
          make O=out -j$(nproc)

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: cronos-dt2w-boot
          path: out/arch/arm64/boot/Image-dtb
