name: Build CronosKernel DT2W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc bison flex \
              libssl-dev libelf-dev libncurses-dev git wget unzip \
              python3 gcc-aarch64-linux-gnu

      - name: Checkout kernel source from upstream
        uses: actions/checkout@v4
        with:
          repository: ananjaser1211/Cronos_8890
          ref: cronos
          path: Cronos

      - name: Verify kernel source
        run: ls Cronos/drivers/input/touchscreen/wake_gestures.c

      - name: Patch DT2W
        run: |
          cd Cronos
          sed -i 's/#define DT2W_DEFAULT\t\t0/#define DT2W_DEFAULT\t\t1/' \
              drivers/input/touchscreen/wake_gestures.c
          grep -n "DT2W_DEFAULT" drivers/input/touchscreen/wake_gestures.c

      - name: Build kernel
        run: |
          cd Cronos
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          which aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version
          ls arch/arm64/configs/ | grep hero
          make O=out hero2_defconfig
          make O=out -j$(nproc)

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: cronos-dt2w-boot
          path: out/arch/arm64/boot/Image-dtb
